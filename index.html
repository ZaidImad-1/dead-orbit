<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#000008"/>
  <title>Dead Orbit 🧟</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body,#root{width:100%;height:100%;background:#000008;overflow:hidden;}
    body{touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
    #loading{position:fixed;inset:0;background:#000008;display:flex;flex-direction:column;
      align-items:center;justify-content:center;color:#aa44ff;font-family:monospace;gap:14px;z-index:999;}
    .spin{animation:spin 1s linear infinite;font-size:48px;}
    .bar{width:200px;height:4px;background:#111;border-radius:2px;overflow:hidden;border:1px solid #aa44ff33;}
    .bar-fill{height:100%;background:linear-gradient(90deg,#aa44ff,#ff2244);border-radius:2px;animation:load 1.8s ease-in-out infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes load{0%{width:0%}100%{width:100%}}
  </style>
</head>
<body>
  <div id="loading">
    <div class="spin">🚀</div>
    <div style="font-size:14px;letter-spacing:3px;text-transform:uppercase">Loading Dead Orbit</div>
    <div class="bar"><div class="bar-fill"></div></div>
    <div style="font-size:9px;color:#333;letter-spacing:2px;text-transform:uppercase">By Zaid Imad</div>
  </div>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;


const W = typeof window !== "undefined" ? Math.min(window.innerWidth, 420) : 400;
const H = typeof window !== "undefined" ? Math.min(window.innerHeight, 700) : 700;
const isMobile = typeof navigator !== "undefined" ? /Android|iPhone|iPad/i.test(navigator.userAgent) : false;

const LEVELS = [
  { name:"Dead Orbit",     bg:["#000008","#0a0015"], zombieHp:1, zombieSpeed:0.5, spawnRate:160, count:12, shootBack:false, color:"#aa44ff" },
  { name:"Blood Nebula",   bg:["#0a0000","#1a0008"], zombieHp:2, zombieSpeed:0.7, spawnRate:130, count:18, shootBack:true,  color:"#ff2222" },
  { name:"Cursed Station", bg:["#000a00","#0a1500"], zombieHp:2, zombieSpeed:0.9, spawnRate:110, count:22, shootBack:true,  color:"#22ff44" },
  { name:"The Void",       bg:["#050005","#100010"], zombieHp:3, zombieSpeed:1.1, spawnRate:95,  count:28, shootBack:true,  color:"#ff88ff" },
  { name:"Hell Gate",      bg:["#100000","#200005"], zombieHp:3, zombieSpeed:1.2, spawnRate:80,  count:35, shootBack:true,  color:"#ff6600" },
];
const ZOMBIE_EMOJIS   = ["🧟","🧟‍♂️","🧟‍♀️"];
const EXPLOSION_EMOJIS= ["💥","✨","🔥"];

// ─── Skins catalogue ─────────────────────────────────────────────────────────
const SKINS = [
  { id:"default", name:"Standard",   ship:"🚀", bullet:"#00ffff", trail:"#00ffff44", price:0,    owned:true  },
  { id:"fire",    name:"Inferno",    ship:"🔥", bullet:"#ff6600", trail:"#ff660044", price:150,  owned:false },
  { id:"skull",   name:"Reaper",     ship:"💀", bullet:"#aa44ff", trail:"#aa44ff44", price:250,  owned:false },
  { id:"ufo",     name:"Alien",      ship:"🛸", bullet:"#44ff88", trail:"#44ff8844", price:400,  owned:false },
  { id:"sword",   name:"Samurai",    ship:"⚔️", bullet:"#ff4466", trail:"#ff446644", price:600,  owned:false },
  { id:"crystal", name:"Crystal",    ship:"💎", bullet:"#88eeff", trail:"#88eeff44", price:900,  owned:false },
];

// ─── Audio ───────────────────────────────────────────────────────────────────
function mkAudio() { try { return new (window.AudioContext||window.webkitAudioContext)(); } catch{return null;} }
function shootSound(ctx) {
  if(!ctx) return;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);
  o.type="square";
  o.frequency.setValueAtTime(880,ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(220,ctx.currentTime+0.08);
  g.gain.setValueAtTime(0.15,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.1);
  o.start();o.stop(ctx.currentTime+0.1);
}
function hitSound(ctx) {
  if(!ctx) return;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);
  o.type="sawtooth";
  o.frequency.setValueAtTime(300,ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(80,ctx.currentTime+0.15);
  g.gain.setValueAtTime(0.2,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
  o.start();o.stop(ctx.currentTime+0.2);
}
function comboSound(ctx, mult) {
  if(!ctx) return;
  const freqs=[400,500,650,900,1200];
  const f=freqs[Math.min(mult-2,4)];
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);
  o.type="triangle";
  o.frequency.setValueAtTime(f,ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(f*1.5,ctx.currentTime+0.1);
  g.gain.setValueAtTime(0.2,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);
  o.start();o.stop(ctx.currentTime+0.2);
}
function deathSound(ctx) {
  if(!ctx) return;
  [200,150,100].forEach((f,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type="sawtooth";o.frequency.setValueAtTime(f,ctx.currentTime+i*0.1);
    g.gain.setValueAtTime(0.25,ctx.currentTime+i*0.1);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.1+0.2);
    o.start(ctx.currentTime+i*0.1);o.stop(ctx.currentTime+i*0.1+0.25);
  });
}
function levelUpSound(ctx) {
  if(!ctx) return;
  [300,400,600,900].forEach((f,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type="triangle";o.frequency.setValueAtTime(f,ctx.currentTime+i*0.12);
    g.gain.setValueAtTime(0.2,ctx.currentTime+i*0.12);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.15);
    o.start(ctx.currentTime+i*0.12);o.stop(ctx.currentTime+i*0.12+0.18);
  });
}
function startHorrorMusic(ctx) {
  if(!ctx) return null;
  let stopped=false;
  const notes=[110,98,87,82,98,110,87,77];
  function scheduleLoop(base) {
    if(stopped) return;
    notes.forEach((freq,i)=>{
      const t=base+i*0.5;
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type="sawtooth";o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.06,t+0.05);
      g.gain.linearRampToValueAtTime(0.04,t+0.4);
      g.gain.linearRampToValueAtTime(0,t+0.5);
      o.start(t);o.stop(t+0.52);
    });
    const drone=ctx.createOscillator(),dg=ctx.createGain();
    drone.connect(dg);dg.connect(ctx.destination);
    drone.type="sine";drone.frequency.setValueAtTime(55,base);
    dg.gain.setValueAtTime(0.08,base);
    dg.gain.linearRampToValueAtTime(0,base+4);
    drone.start(base);drone.stop(base+4.1);
    if(!stopped){
      const timeout=setTimeout(()=>scheduleLoop(base+4),3700);
      return()=>clearTimeout(timeout);
    }
  }
  scheduleLoop(ctx.currentTime+0.1);
  return()=>{stopped=true;};
}
function enterFullscreen() {
  const el=document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

// ─── Main App ────────────────────────────────────────────────────────────────
function App() {
  const [screen,    setScreen]    = useState("intro");
  const [levelIdx,  setLevelIdx]  = useState(0);
  const [score,     setScore]     = useState(0);
  const [best,      setBest]      = useState(0);
  const [hp,        setHp]        = useState(5);
  const [killed,    setKilled]    = useState(0);
  const [coins,     setCoins]     = useState(0);
  const [combo,     setCombo]     = useState(0);
  const [comboFlash,setComboFlash]= useState(false);
  const [musicOn,   setMusicOn]   = useState(true);

  // Shop & skins state — persisted in memory
  const [skinsList, setSkinsList] = useState(SKINS);
  const [activeSkin,setActiveSkin]= useState("default");
  const [shopScreen,setShopScreen]= useState(false); // overlay on intro

  const canvasRef    = useRef(null);
  const ctxRef       = useRef(null);
  const stateRef     = useRef(null);
  const screenRef    = useRef("intro");
  const rafRef       = useRef(null);
  const audioRef     = useRef(null);
  const musicStopRef = useRef(null);
  const keysRef      = useRef({});
  const touchRef     = useRef({left:false,right:false,shoot:false});
  const coinsRef     = useRef(0);
  const comboRef     = useRef(0);
  const comboTimerRef= useRef(null);
  const activeSkinRef  = useRef("default");
  const skinsListRef   = useRef(SKINS);

  const getAudio=()=>{
    if(!audioRef.current) audioRef.current=mkAudio();
    if(audioRef.current?.state==="suspended") audioRef.current.resume();
    return audioRef.current;
  };

  // ctx is grabbed inside the game loop when canvas is available

  useEffect(()=>{
    if(screen==="intro"&&musicOn){
      const t=setTimeout(()=>{
        const ctx=getAudio();
        if(musicStopRef.current){musicStopRef.current();musicStopRef.current=null;}
        musicStopRef.current=startHorrorMusic(ctx);
      },400);
      return()=>{clearTimeout(t);if(musicStopRef.current){musicStopRef.current();musicStopRef.current=null;}};
    } else {
      if(musicStopRef.current){musicStopRef.current();musicStopRef.current=null;}
    }
  },[screen,musicOn]);

  // keep activeSkinRef in sync
  useEffect(()=>{activeSkinRef.current=activeSkin;},[activeSkin]);
  useEffect(()=>{skinsListRef.current=skinsList;},[skinsList]);

  const currentSkin=()=>skinsList.find(s=>s.id===activeSkin)||SKINS[0];

  // ── Combo system ──
  const triggerCombo=useCallback((lvlZombieHp)=>{
    const newCombo=comboRef.current+1;
    comboRef.current=newCombo;
    // reset combo timer (1.5s of inactivity breaks combo)
    if(comboTimerRef.current) clearTimeout(comboTimerRef.current);
    comboTimerRef.current=setTimeout(()=>{comboRef.current=0;setCombo(0);},1500);
    setCombo(newCombo);
    const mult=Math.floor(newCombo/3)+1; // x2 at 3 kills, x3 at 6, etc
    if(newCombo>0&&newCombo%3===0){
      setComboFlash(true);
      setTimeout(()=>setComboFlash(false),400);
      comboSound(getAudio(),mult);
      navigator.vibrate?.([30,20,30]);
      // bonus points
      const bonus=50*mult;
      if(stateRef.current){
        stateRef.current.score+=bonus;
        setScore(stateRef.current.score);
      }
    }
    return mult;
  },[]);

  // ── Build state ──
  const buildState=useCallback((lvlIdx,prevScore=0,prevCoins=0)=>{
    return {
      lvlIdx,
      ship:{x:W/2,y:H-90,w:36,h:36},
      bullets:[],enemyBullets:[],zombies:[],explosions:[],trails:[],
      stars:Array.from({length:isMobile?30:60},()=>({
        x:Math.random()*W,y:Math.random()*H,
        r:Math.random()*1.5+0.3,speed:Math.random()*0.8+0.2,brightness:Math.random()*0.5+0.3,
      })),
      score:prevScore,coins:prevCoins,hp:5,killed:0,
      frame:0,spawnCount:0,shootCooldown:0,shakeFrames:0,flashFrames:0,flashColor:"#ffffff",
    };
  },[]);

  const startLevel=useCallback((idx,prevScore=0)=>{
    comboRef.current=0; setCombo(0);
    ctxRef.current=null; // reset so game loop grabs fresh context on new canvas mount
    const c=coinsRef.current;
    stateRef.current=buildState(idx,prevScore,c);
    screenRef.current="playing";
    setScreen("playing");setLevelIdx(idx);setScore(prevScore);setHp(5);setKilled(0);
  },[buildState]);

  // ── Keyboard ──
  useEffect(()=>{
    const down=e=>{keysRef.current[e.key]=true;};
    const up=e=>{keysRef.current[e.key]=false;};
    window.addEventListener("keydown",down);
    window.addEventListener("keyup",up);
    return()=>{window.removeEventListener("keydown",down);window.removeEventListener("keyup",up);};
  },[]);

  // ── Game loop ──
  useEffect(()=>{
    if(screen!=="playing"){cancelAnimationFrame(rafRef.current);return;}
    const tick=()=>{
      rafRef.current=requestAnimationFrame(tick);
      const s=stateRef.current;
      if(!s||!canvasRef.current) return;
      // grab or cache context each frame (safe for late-mount canvas)
      if(!ctxRef.current) ctxRef.current=canvasRef.current.getContext("2d");
      const ctx=ctxRef.current;
      if(!ctx) return;
      const lvl=LEVELS[s.lvlIdx];
      const skin=skinsListRef.current.find(sk=>sk.id===activeSkinRef.current)||SKINS[0];
      s.frame++;

      // Move ship
      const spd=isMobile?6:4;
      const keys=keysRef.current,t=touchRef.current;
      if((keys["ArrowLeft"]||keys["a"]||t.left)&&s.ship.x>s.ship.w/2) s.ship.x-=spd;
      if((keys["ArrowRight"]||keys["d"]||t.right)&&s.ship.x<W-s.ship.w/2) s.ship.x+=spd;

      // Shoot
      s.shootCooldown=Math.max(0,s.shootCooldown-1);
      if((keys[" "]||keys["ArrowUp"]||t.shoot)&&s.shootCooldown===0){
        s.bullets.push({x:s.ship.x,y:s.ship.y-20,vy:-10,w:4,h:14,color:skin.bullet});
        // trail particles behind bullet
        s.trails.push({x:s.ship.x,y:s.ship.y-10,life:8,color:skin.trail});
        s.shootCooldown=12;
        shootSound(getAudio());
        navigator.vibrate?.(8);
      }

      // Spawn zombies
      if(s.spawnCount<lvl.count&&s.frame%lvl.spawnRate===0){
        let spawnX,tries=0,minDist=70;
        do{spawnX=50+Math.random()*(W-100);tries++;}
        while(tries<20&&s.zombies.some(z=>z.y<120&&Math.abs(z.x-spawnX)<minDist));
        s.zombies.push({
          x:spawnX,y:-40,vy:lvl.zombieSpeed,
          hp:lvl.zombieHp,maxHp:lvl.zombieHp,
          emoji:ZOMBIE_EMOJIS[Math.floor(Math.random()*3)],
          shootTimer:Math.floor(Math.random()*150)+90,
          id:s.frame,wobble:Math.random()*Math.PI*2,wobbleSpeed:0.04+Math.random()*0.02,
        });
        s.spawnCount++;
      }

      // Move zombies
      s.zombies.forEach(z=>{
        z.y+=z.vy;z.wobble+=z.wobbleSpeed;z.x+=Math.sin(z.wobble)*1.2;
        if(lvl.shootBack){
          z.shootTimer--;
          if(z.shootTimer<=0){
            s.enemyBullets.push({x:z.x,y:z.y+20,vy:3.5,w:6,h:10,color:lvl.color});
            z.shootTimer=Math.floor(Math.random()*100)+80;
          }
        }
      });

      // Move bullets + trails
      s.bullets=s.bullets.filter(b=>{b.y+=b.vy;return b.y>-20;});
      s.enemyBullets=s.enemyBullets.filter(b=>{b.y+=b.vy;return b.y<H+20;});
      s.trails=s.trails.filter(tr=>{tr.y-=2;tr.life--;return tr.life>0;});

      // Bullet vs zombie
      s.bullets=s.bullets.filter(b=>{
        let hit=false;
        s.zombies=s.zombies.map(z=>{
          if(!hit&&Math.abs(b.x-z.x)<28&&Math.abs(b.y-z.y)<28){
            z.hp--;hit=true;
            if(z.hp<=0){
              s.explosions.push({x:z.x,y:z.y,born:s.frame,emoji:EXPLOSION_EMOJIS[Math.floor(Math.random()*3)]});
              // coins drop
              const coinDrop=lvl.zombieHp*5;
              s.coins=(s.coins||0)+coinDrop;
              coinsRef.current=s.coins;
              setCoins(s.coins);
              // score
              const mult=Math.floor(comboRef.current/3)+1;
              s.score+=10*lvl.zombieHp*mult;
              s.killed++;
              hitSound(getAudio());
              navigator.vibrate?.(15);
              setScore(s.score);setKilled(s.killed);
              triggerCombo(lvl.zombieHp);
            }
          }
          return z;
        }).filter(z=>z.hp>0);
        return !hit;
      });

      // Enemy bullet vs ship
      s.enemyBullets=s.enemyBullets.filter(b=>{
        const hit=Math.abs(b.x-s.ship.x)<22&&Math.abs(b.y-s.ship.y)<22;
        if(hit){
          s.hp--;s.shakeFrames=8;s.flashFrames=6;s.flashColor="#ff000066";
          comboRef.current=0;setCombo(0); // break combo on hit
          deathSound(getAudio());navigator.vibrate?.(40);setHp(s.hp);
          if(s.hp<=0){setBest(b=>Math.max(b,s.score));screenRef.current="dead";setScreen("dead");cancelAnimationFrame(rafRef.current);}
        }
        return !hit;
      });

      // Zombie reaches bottom
      s.zombies=s.zombies.filter(z=>{
        if(z.y>H-60){
          s.hp--;s.shakeFrames=12;s.flashFrames=8;s.flashColor="#ff000088";
          comboRef.current=0;setCombo(0);
          deathSound(getAudio());navigator.vibrate?.(60);setHp(s.hp);
          s.explosions.push({x:z.x,y:z.y,born:s.frame,emoji:"💥"});
          if(s.hp<=0){setBest(b=>Math.max(b,s.score));screenRef.current="dead";setScreen("dead");cancelAnimationFrame(rafRef.current);}
          return false;
        }
        return true;
      });

      // Level complete
      if(s.spawnCount>=lvl.count&&s.zombies.length===0&&screenRef.current==="playing"){
        levelUpSound(getAudio());setBest(b=>Math.max(b,s.score));
        if(s.lvlIdx>=LEVELS.length-1){screenRef.current="win";setScreen("win");}
        else{screenRef.current="levelup";setScreen("levelup");}
        cancelAnimationFrame(rafRef.current);return;
      }

      s.explosions=s.explosions.filter(e=>s.frame-e.born<20);
      s.shakeFrames=Math.max(0,s.shakeFrames-1);
      s.flashFrames=Math.max(0,(s.flashFrames||0)-1);

      // ── DRAW ──────────────────────────────────────────────────────────────
      const shakeX=s.shakeFrames>0?(Math.random()-0.5)*8:0;
      const shakeY=s.shakeFrames>0?(Math.random()-0.5)*8:0;
      ctx.save();
      ctx.translate(shakeX,shakeY);

      // BG
      const bg=ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0,lvl.bg[0]);bg.addColorStop(1,lvl.bg[1]);
      ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

      // Stars
      s.stars.forEach(star=>{
        star.y+=star.speed;if(star.y>H)star.y=-5;
        const tw=0.3+0.7*Math.abs(Math.sin(s.frame/60+star.x));
        ctx.globalAlpha=tw*star.brightness;
        ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fill();
      });
      ctx.globalAlpha=1;

      // Nebula
      const neb=ctx.createRadialGradient(W*0.3,H*0.4,0,W*0.3,H*0.4,W*0.5);
      neb.addColorStop(0,`rgba(${parseInt(lvl.color.slice(1,3),16)},${parseInt(lvl.color.slice(3,5),16)},${parseInt(lvl.color.slice(5,7),16)},0.06)`);
      neb.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);

      // Screen flash on hit
      if(s.flashFrames>0){
        ctx.fillStyle=s.flashColor;ctx.fillRect(0,0,W,H);
      }

      // Trails
      s.trails.forEach(tr=>{
        ctx.globalAlpha=tr.life/8*0.6;
        ctx.fillStyle=tr.color;
        ctx.beginPath();ctx.arc(tr.x,tr.y,3,0,Math.PI*2);ctx.fill();
      });
      ctx.globalAlpha=1;

      // Enemy bullets
      s.enemyBullets.forEach(b=>{
        ctx.fillStyle=lvl.color;
        ctx.shadowColor=lvl.color;ctx.shadowBlur=isMobile?0:15;
        ctx.beginPath();ctx.ellipse(b.x,b.y,b.w/2,b.h/2,0,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
      });

      // Player bullets — skin color + trail effect
      s.bullets.forEach(b=>{
        ctx.fillStyle=skin.bullet;
        ctx.shadowColor=skin.bullet;ctx.shadowBlur=isMobile?0:15;
        ctx.beginPath();ctx.ellipse(b.x,b.y,b.w/2,b.h/2,0,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
      });

      // Zombies
      s.zombies.forEach(z=>{
        const bw=40,bh=4;
        ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(z.x-bw/2,z.y-28,bw,bh);
        ctx.fillStyle=z.hp>z.maxHp/2?"#44ff44":"#ff4444";
        ctx.fillRect(z.x-bw/2,z.y-28,bw*(z.hp/z.maxHp),bh);
        ctx.font="28px serif";ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.shadowColor=lvl.color;ctx.shadowBlur=isMobile?0:15;
        ctx.fillText(z.emoji,z.x,z.y);ctx.shadowBlur=0;
      });

      // Explosions
      s.explosions.forEach(e=>{
        const age=(s.frame-e.born)/20;
        ctx.globalAlpha=1-age;
        ctx.font=`${24+age*20}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText(e.emoji,e.x,e.y);ctx.globalAlpha=1;
      });

      // Ship — skin emoji
      ctx.save();ctx.translate(s.ship.x,s.ship.y);
      ctx.shadowColor=skin.bullet;ctx.shadowBlur=isMobile?0:15;
      ctx.font="36px serif";ctx.textAlign="center";ctx.textBaseline="middle";

      ctx.font="18px serif";ctx.textAlign="center";
      ctx.fillText("🔥",s.ship.x,s.ship.y+26);ctx.shadowBlur=0;

      ctx.restore();
    };
    rafRef.current=requestAnimationFrame(tick);
    const onVis=()=>{};
    document.addEventListener("visibilitychange",onVis);
    return()=>{cancelAnimationFrame(rafRef.current);document.removeEventListener("visibilitychange",onVis);};

      const el = ref.current;
      if (!el) return;
      const start = e => { e.preventDefault(); e.stopPropagation(); touchRef.current[key]=true; navigator.vibrate?.(8); };
      const end   = e => { e.preventDefault(); e.stopPropagation(); touchRef.current[key]=false; };
      // pointerdown fires before touchstart — fastest possible response
      el.addEventListener("pointerdown",  start, { passive: false });
      el.addEventListener("pointerup",    end,   { passive: false });
      el.addEventListener("pointerleave", end,   { passive: false });
      el.addEventListener("pointercancel",end,   { passive: false });
      // fallback for older devices
      el.addEventListener("touchstart", start, { passive: false });
      el.addEventListener("touchend",   end,   { passive: false });
      el.addEventListener("touchcancel",end,   { passive: false });
      return () => {
        el.removeEventListener("pointerdown",  start);
        el.removeEventListener("pointerup",    end);
        el.removeEventListener("pointerleave", end);
        el.removeEventListener("pointercancel",end);
        el.removeEventListener("touchstart", start);
        el.removeEventListener("touchend",   end);
        el.removeEventListener("touchcancel",end);

  );

  // ── LEVEL UP ──
  if(screen==="levelup") return (
    <div style={{minHeight:"100vh",background:`linear-gradient(160deg,${LEVELS[levelIdx+1]?.bg[0]||"#000"},${LEVELS[levelIdx+1]?.bg[1]||"#000"})`,
      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      fontFamily:"monospace",color:"#fff",gap:14,padding:24,textAlign:"center"}}>
      <div style={{fontSize:64,animation:"floatLogo 2s ease-in-out infinite"}}>🎯</div>
      <div style={{color:LEVELS[levelIdx+1]?.color||"#fff",fontSize:28,fontWeight:900,
        letterSpacing:3,textShadow:`0 0 20px ${LEVELS[levelIdx+1]?.color||"#fff"}`}}>
        LEVEL {levelIdx+2}
      </div>
      <div style={{color:"#aaa",fontSize:14}}>{LEVELS[levelIdx+1]?.name}</div>
      <div style={{color:"#888",fontSize:12,maxWidth:240,lineHeight:1.7}}>
        🧟 {LEVELS[levelIdx+1]?.count} zombies incoming<br/>
        {LEVELS[levelIdx+1]?.shootBack?"⚡ They shoot back!":"🚶 Slow walkers"}
      </div>
      <div style={{display:"flex",gap:10}}>
        <div style={{background:"rgba(255,255,255,0.05)",border:`1px solid ${LEVELS[levelIdx+1]?.color}33`,borderRadius:12,padding:"10px 20px",textAlign:"center"}}>
          <div style={{color:"#555",fontSize:11}}>Score</div>
          <div style={{color:LEVELS[levelIdx+1]?.color,fontSize:26,fontWeight:900}}>{score}</div>
        </div>
        <div style={{background:"rgba(255,215,0,0.08)",border:"1px solid #ffd70033",borderRadius:12,padding:"10px 20px",textAlign:"center"}}>
          <div style={{color:"#555",fontSize:11}}>Coins</div>
          <div style={{color:"#ffd700",fontSize:26,fontWeight:900}}>🪙 {coins}</div>
        </div>
      </div>
      <button onClick={()=>startLevel(levelIdx+1,score)} style={{padding:"14px 40px",
        background:`linear-gradient(135deg,${LEVELS[levelIdx+1]?.color}88,${LEVELS[levelIdx+1]?.color}44)`,
        border:`2px solid ${LEVELS[levelIdx+1]?.color}44`,borderRadius:36,color:"#fff",
        fontSize:16,fontWeight:900,cursor:"pointer",letterSpacing:1,
        boxShadow:`0 0 30px ${LEVELS[levelIdx+1]?.color}44`,animation:"pulsebtn 1.8s ease-in-out infinite"}}>
        ▶ CONTINUE
      </button>
      <style>{`
        @keyframes floatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
        @keyframes pulsebtn{0%,100%{box-shadow:0 0 15px rgba(200,100,255,0.3)}50%{box-shadow:0 0 40px rgba(200,100,255,0.7)}}
      `}</style>
    </div>
  );

  // ── WIN ──
  if(screen==="win") return (
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#050000,#100005,#030010)",
      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      fontFamily:"monospace",color:"#fff",gap:14,padding:24,textAlign:"center",position:"relative",overflow:"hidden"}}>
      {Array.from({length:35}).map((_,i)=>(
        <div key={i} style={{position:"fixed",fontSize:i%4===0?20:12,
          top:`${Math.random()*100}%`,left:`${Math.random()*100}%`,
          animation:`twinkle ${1+Math.random()*2}s ease-in-out infinite alternate`,
          pointerEvents:"none",opacity:Math.random()*0.6+0.3}}>
          {["⭐","💫","✨","🌟"][i%4]}
        </div>
      ))}
      <div style={{fontSize:80,filter:"drop-shadow(0 0 30px rgba(255,215,0,0.9))",
        animation:"floatLogo 2.5s ease-in-out infinite",marginBottom:6}}>🏆</div>
      <div style={{color:"#ffd700",fontSize:26,fontWeight:900,letterSpacing:2,textShadow:"0 0 28px gold"}}>GALAXY CLEARED!</div>
      <div style={{color:"#ff9900",fontSize:20,fontWeight:900,marginTop:4}}>🎉 مبروك يا بطل وادي الحداد 🎉</div>
      <div style={{color:"#ffcc66",fontSize:12,opacity:0.85}}>All 5 levels conquered — you are the zombie slayer!</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>
        <div style={{background:"rgba(255,215,0,0.1)",border:"1px solid #ffd70030",borderRadius:12,padding:"12px 22px",textAlign:"center"}}>
          <div style={{color:"#666",fontSize:11}}>Final Score</div>
          <div style={{color:"#ffd700",fontSize:36,fontWeight:900,textShadow:"0 0 16px gold"}}>{score}</div>
          <div style={{color:"#555",fontSize:11}}>Best: {best}</div>
        </div>
        <div style={{background:"rgba(255,215,0,0.06)",border:"1px solid #ffd70020",borderRadius:12,padding:"12px 22px",textAlign:"center"}}>
          <div style={{color:"#666",fontSize:11}}>Total Coins</div>
          <div style={{color:"#ffd700",fontSize:36,fontWeight:900}}>🪙 {coins}</div>
        </div>
      </div>
      <div style={{color:"#444",fontSize:11,marginTop:4}}>By <span style={{color:"#ffd700"}}>Zaid Imad</span></div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={()=>{setScreen("intro");setScore(0);setBest(b=>Math.max(b,score));}}
          style={{padding:"13px 28px",background:"linear-gradient(135deg,#ffd700,#c89000)",
            border:"none",borderRadius:36,color:"#000",fontSize:15,fontWeight:900,cursor:"pointer"}}>🏠 Menu</button>
        <button onClick={()=>setShopScreen(true)} style={{padding:"13px 28px",
          background:"rgba(255,215,0,0.12)",border:"2px solid rgba(255,215,0,0.3)",
          borderRadius:36,color:"#ffd700",fontSize:15,fontWeight:700,cursor:"pointer"}}>🪙 Shop</button>
      </div>
      <style>{`
        @keyframes floatLogo{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.04)}}
        @keyframes twinkle{from{opacity:0.15}to{opacity:0.9}}
      `}</style>
    </div>
  );
}

window.__DeadOrbitApp = App;

window.addEventListener("load", () => {
  document.getElementById("loading").style.display = "none";
  ReactDOM.createRoot(document.getElementById("root")).render(
    React.createElement(window.__DeadOrbitApp)
  );
});
  </script>
</body>
</html>
